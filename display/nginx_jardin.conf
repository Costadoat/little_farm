# /etc/nginx/sites-available/jardin
# Reverse proxy Nginx devant gunicorn (voir start.sh), avec HTTPS via
# certificat Let's Encrypt (certbot).
#
# Prérequis : ce site doit être joignable depuis Internet sur un nom de
# domaine (ex: jardin.tondomaine.fr) pour que Let's Encrypt puisse le
# valider. Si le site n'est accessible qu'en local (LAN), Let's Encrypt
# ne fonctionnera pas : utilise un certificat auto-signé à la place
# (voir note en bas de fichier).

server {
    listen 80;
    server_name jardin.tondomaine.fr;

    # Certbot viendra automatiquement ajouter ici la redirection vers 443
    # après "certbot --nginx -d jardin.tondomaine.fr"
    location / {
        proxy_pass http://unix:/django/jardin/jardin_display.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Installation (une seule fois) -----------------------------------------
# sudo apt install nginx certbot python3-certbot-nginx
# sudo ln -s /etc/nginx/sites-available/jardin /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# sudo certbot --nginx -d jardin.tondomaine.fr
#   -> certbot modifie ce fichier pour ajouter listen 443 ssl + les
#      chemins vers les certificats, et met en place le renouvellement auto.

# --- Si le site est uniquement en local (pas de nom de domaine public) ----
# Remplace certbot par un certificat auto-signé :
#   sudo openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
#     -keyout /etc/ssl/private/jardin.key -out /etc/ssl/certs/jardin.crt
# puis ajoute un bloc "listen 443 ssl;" avec ssl_certificate/ssl_certificate_key
# pointant vers ces deux fichiers. Le navigateur affichera un avertissement
# de certificat non reconnu (normal pour de l'auto-signé), à valider une fois.
